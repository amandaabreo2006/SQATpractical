# ---------------------------------------------------------------
# Framework configuration.
# Any key can be overridden from the command line, e.g.
#   mvnw test -Dheadless=true -Dexplicit.wait.seconds=25
# ---------------------------------------------------------------

# Application under test (OrangeHRM OS 5.9 public demo)
base.url=https://opensource-demo.orangehrmlive.com/web/index.php

# Public demo credentials, printed on the demo's own login page
admin.username=Admin
admin.password=admin123

# Browser settings (Chrome only for this project)
browser=chrome
headless=false
window.width=1366
window.height=900

# Wait strategy (seconds). No implicit waits are used: all synchronisation is explicit.
explicit.wait.seconds=30
page.load.timeout.seconds=60

# OrangeHRM password policy. The public demo uses min 7 (confirmed via /api/v2/auth/public/validation/password);
# the installer default since v5.4 is 8. Change this if the demo is reconfigured.
password.min.length=7
password.max.length=64
